plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zentor.player'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zentor.player'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        // 2.0.<n> (MixUp); every 100 the middle number goes up (2.0.99 → 2.1.0), the same as the PC
        versionName mixupVersionName()
        // yt-dlp comes with its own Python: only for phones' processors, to keep the APK small
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        // the Google OAuth client's secret: never in the repository (it's public).
        // From the environment (GitHub Actions: the GOOGLE_CLIENT_SECRET repository
        // secret) or android/local.properties (google.clientSecret=…, not committed).
        // Empty = the Google account shows as «not available yet». See notas/GOOGLE.md
        buildConfigField 'String', 'GOOGLE_CLIENT_SECRET', javaString(googleClientSecret())
    }

    buildFeatures {
        buildConfig true
    }

    // youtubedl-android runs Python and yt-dlp from the native libraries folder
    packaging {
        jniLibs { useLegacyPackaging true }
    }

    // A fixed key so new builds install over old ones. It's a development
    // key: make a private one before publishing on a store.
    signingConfigs {
        dev {
            storeFile file('zentor-dev.keystore')
            storePassword 'zentordev'
            keyAlias 'zentor'
            keyPassword 'zentordev'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.dev
        }
        debug {
            signingConfig signingConfigs.dev
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The interface is the same one the Windows version uses.
    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/webassets"
        }
    }
}

tasks.register('copyWeb', Copy) {
    from "$rootDir/../web"
    into "$buildDir/generated/webassets/web"
}
preBuild.dependsOn copyWeb

dependencies {
    // yt-dlp for YouTube songs as plain audio (YtAudio)
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
}

// MixUp: 2.0.<n> (build 260 = 2.0.0); every 100 the middle number goes up:
// 2.0.99 → 2.1.0, the same as the PC
def mixupVersionName() {
    int k = Math.max(0, Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '260') - 260)
    return "2.${k.intdiv(100)}.${k % 100}"
}

// the Google client secret: GOOGLE_CLIENT_SECRET, else local.properties' google.clientSecret, else ""
def googleClientSecret() {
    def env = System.getenv('GOOGLE_CLIENT_SECRET')
    if (env != null && !env.trim().isEmpty()) return env.trim()
    def f = rootProject.file('local.properties')
    if (f.exists()) {
        def p = new Properties()
        f.withInputStream { p.load(it) }
        def v = p.getProperty('google.clientSecret')
        if (v != null) return v.trim()
    }
    return ''
}

def javaString(String s) {
    return '"' + s.replace('\\', '\\\\').replace('"', '\\"') + '"'
}
