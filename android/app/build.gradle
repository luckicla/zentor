plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zentor.player'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zentor.player'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0'
    }

    // A fixed key so new builds install over old ones. It's a development
    // key: make a private one before publishing on a store.
    signingConfigs {
        dev {
            storeFile file('zentor-dev.keystore')
            storePassword 'zentordev'
            keyAlias 'zentor'
            keyPassword 'zentordev'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.dev
        }
        debug {
            signingConfig signingConfigs.dev
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The interface is the same one the Windows version uses.
    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/webassets"
        }
    }
}

tasks.register('copyWeb', Copy) {
    from "$rootDir/../web"
    into "$buildDir/generated/webassets/web"
}
preBuild.dependsOn copyWeb
