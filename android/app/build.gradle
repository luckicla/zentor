plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zentor.player'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zentor.player'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        // 1.5.<n>; every 100 the middle number goes up (1.5.100 → 1.6.1), the same as the PC
        versionName zentorVersionName()
        // yt-dlp comes with its own Python: only for phones' processors, to keep the APK small
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    // youtubedl-android runs Python and yt-dlp from the native libraries folder
    packaging {
        jniLibs { useLegacyPackaging true }
    }

    // A fixed key so new builds install over old ones. It's a development
    // key: make a private one before publishing on a store.
    signingConfigs {
        dev {
            storeFile file('zentor-dev.keystore')
            storePassword 'zentordev'
            keyAlias 'zentor'
            keyPassword 'zentordev'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.dev
        }
        debug {
            signingConfig signingConfigs.dev
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The interface is the same one the Windows version uses.
    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/webassets"
        }
    }
}

tasks.register('copyWeb', Copy) {
    from "$rootDir/../web"
    into "$buildDir/generated/webassets/web"
}
preBuild.dependsOn copyWeb

dependencies {
    // yt-dlp for YouTube songs as plain audio (YtAudio)
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
}

// 1.5.<n> (build 106 = 1.5.14); every 100 the middle number goes up:
// 1.5.100 → 1.6.1 … 1.6.100 → 1.7.1, the same as the PC
def zentorVersionName() {
    int k = Math.max(14, Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '106') - 92) - 1
    return "1.${5 + k.intdiv(100)}.${k % 100 + 1}"
}
