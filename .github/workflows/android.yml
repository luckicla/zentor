name: Android APK

on:
  push:
    branches: [android, main]
    paths: ['android/**', 'web/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk ZenTor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZenTor-apk
          path: ZenTor.apk

      # A fixed "android-latest" release, so the newest APK is always at the same link.
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ZenTor para Android
          prerelease: true
          make_latest: false
          body: Última versión compilada de la rama ${{ github.ref_name }}. Descarga ZenTor.apk e instálala en el móvil.
          files: ZenTor.apk
