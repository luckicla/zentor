name: MixUp (APK + exe + Mac)

on:
  push:
    branches: [android, main, 'release/**']
    paths: ['android/**', 'web/**', 'desktop/**', '**.go', 'go.mod', 'res.rc', 'build.sh', 'build-mac.sh', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: android
        env:
          # the Google OAuth client's secret (repository secret; empty if not set:
          # the build still works, the Google account shows «not available yet»)
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MixUp.apk
          # the same APK with the old name: the apps from before the name change
          # (ZenTor) look for ZenTor.apk to update themselves
          cp MixUp.apk ZenTor.apk
          # the app compares this with its own versionCode to find updates
          echo "${{ github.run_number }} $(sha256sum MixUp.apk | cut -d' ' -f1)" > version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MixUp-apk
          path: MixUp.apk

      # A fixed "android-latest" release, so the newest APK is always at the same link.
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: MixUp para Android
          prerelease: true
          make_latest: false
          body: Última versión compilada de la rama ${{ github.ref_name }}. Descarga MixUp.apk e instálala en el móvil.
          files: |
            MixUp.apk
            ZenTor.apk
            version.txt

  exe:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.build.outputs.v }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Tools for the icon resource
        run: |
          # the runner usually has LLVM already; install only if llvm-rc is missing (with retries)
          if ! ls /usr/lib/llvm-*/bin/llvm-rc >/dev/null 2>&1 && ! command -v llvm-rc >/dev/null; then
            for i in 1 2 3; do
              sudo apt-get update -qq || true
              sudo apt-get install -y -qq --fix-missing llvm && break
              sleep 20
            done
          fi
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -1 >> "$GITHUB_PATH"

      - name: Build
        id: build
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          # the build number goes last (hidden), it's what updates compare
          # MixUp: 2.0.0 was build 260; then 2.0.1, 2.0.2… and every 100 the
          # middle number goes up (2.0.99 → 2.1.0)
          K=$(( ${{ github.run_number }} - 260 )); K=$(( K < 0 ? 0 : K ))
          V="2.$(( K / 100 )).$(( K % 100 ))"
          echo "v=$V" >> "$GITHUB_OUTPUT"
          VERSION="$V.${{ github.run_number }}" ./build.sh
          test -f rsrc_windows_amd64.syso  # the icon made it in
          echo "$V.${{ github.run_number }} $(sha256sum MixUp.exe | cut -d' ' -f1)" > version.txt
          # the same exe with the old name: the ones from before the name change
          # (ZenTor.exe) download ZenTor.exe to update themselves
          cp MixUp.exe ZenTor.exe
          # the short-lived launcher app (ZenTor-Setup.exe) updates from app.txt +
          # ZenTor-pc.zip: the zip brings this exe as its zentor-core.exe,
          # which puts itself back as the single exe and removes the launcher
          rm -rf pkg && mkdir pkg && cp MixUp.exe pkg/zentor-core.exe
          (cd pkg && zip -qr ../ZenTor-pc.zip .)
          echo "$V.${{ github.run_number }} $(sha256sum ZenTor-pc.zip | cut -d' ' -f1)" > app.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MixUp-exe
          path: MixUp.exe

      # MixUp.exe checks this release for updates
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-latest
          name: MixUp para PC
          prerelease: true
          make_latest: false
          body: Última versión de MixUp.exe. Se actualiza sola; si la quieres a mano, pon MixUp.exe en la raíz del USB.
          files: |
            MixUp.exe
            ZenTor.exe
            version.txt
            ZenTor-pc.zip
            app.txt

      # the launcher's installer is gone
      - name: Remove ZenTor-Setup.exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset pc-latest ZenTor-Setup.exe -y -R "${{ github.repository }}" || true

  # MixUp para escritorio (desktop/, Electron, como Compass Launcher): el
  # instalador y la portable, con este mismo MixUp.exe dentro como su servidor.
  # El instalador se actualiza solo desde pc-latest (latest.yml)
  desktop:
    needs: exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MixUp-exe
          path: desktop/bin

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          mv bin/MixUp.exe bin/mixup-core.exe
          npm install --no-audit --no-fund
          npm version "${{ needs.exe.outputs.v }}" --no-git-tag-version --allow-same-version
          npx electron-builder --win nsis portable --publish never
          ls dist
          # what the single MixUp.exe of before looks at to move to the desktop
          # app by itself (installer or portable), checking what it downloads
          echo "${{ needs.exe.outputs.v }} $(sha256sum dist/MixUp-Instalador.exe | cut -d' ' -f1) $(sha256sum dist/MixUp-Portable.exe | cut -d' ' -f1)" > dist/desktop.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MixUp-desktop
          path: |
            desktop/dist/MixUp-Instalador.exe
            desktop/dist/MixUp-Portable.exe

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-latest
          name: MixUp para PC
          prerelease: true
          make_latest: false
          files: |
            desktop/dist/MixUp-Instalador.exe
            desktop/dist/MixUp-Instalador.exe.blockmap
            desktop/dist/MixUp-Portable.exe
            desktop/dist/latest.yml
            desktop/dist/desktop.txt

  # MixUp para Mac: MixUp.app universal (Apple Silicon + Intel) en un .dmg y
  # un .zip, en la release fija "mac-latest"; la app se actualiza sola desde
  # ahí (version.txt: "<versión> <sha256 del zip>"). La misma versión que el exe
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          # la misma cuenta que el exe (2.0.0 fue la build 260…)
          K=$(( ${{ github.run_number }} - 260 )); K=$(( K < 0 ? 0 : K ))
          V="2.$(( K / 100 )).$(( K % 100 ))"
          STRICT=1 VERSION="$V.${{ github.run_number }}" ./build-mac.sh
          # the update unpacks the zip with its own code: check it has the app
          unzip -l dist-mac/MixUp-macOS.zip | grep -q 'MixUp.app/Contents/MacOS/MixUp'
          lipo -archs dist-mac/MixUp.app/Contents/MacOS/MixUp | grep -q arm64
          lipo -archs dist-mac/MixUp.app/Contents/MacOS/MixUp | grep -q x86_64
          # it starts (headless) and answers with its version
          MIXUP_ADDR=127.0.0.1:47899 HOME="$RUNNER_TEMP/h" dist-mac/MixUp.app/Contents/MacOS/MixUp -root "$RUNNER_TEMP/m" -headless &
          PID=$!
          for i in $(seq 1 20); do sleep 1; curl -sf http://127.0.0.1:47899/api/version && break; done
          test "$(curl -sf http://127.0.0.1:47899/api/version)" = "$V.${{ github.run_number }}"
          kill $PID || true

      - uses: actions/upload-artifact@v4
        with:
          name: MixUp-mac
          path: |
            dist-mac/MixUp-macOS.dmg
            dist-mac/MixUp-macOS.zip

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-latest
          name: MixUp para Mac
          prerelease: true
          make_latest: false
          body: |
            Última versión de MixUp para macOS 11 o posterior (Apple Silicon e Intel). Descarga `MixUp-macOS.dmg`, ábrelo y arrastra MixUp a Aplicaciones. Se actualiza sola.

            La primera vez macOS avisa de que no puede comprobar el desarrollador (la app no está firmada con una cuenta de pago de Apple): clic derecho en MixUp → **Abrir** → **Abrir**. En macOS 15 o posterior: ábrela una vez, ve a **Ajustes del Sistema → Privacidad y seguridad** y pulsa **Abrir igualmente**. Si aun así no abre: `xattr -dr com.apple.quarantine /Applications/MixUp.app` en el Terminal.

            Se abre en una ventana propia de Chrome, Edge, Brave o Chromium si tienes alguno (si no, en tu navegador).
          files: |
            dist-mac/MixUp-macOS.dmg
            dist-mac/MixUp-macOS.zip
            dist-mac/version.txt

  # A push to a release/... branch: also a proper release (tag v2.<m>.<n>, the
  # same number the apps show) with both, the APK and the exe
  release:
    # (or a push whose message says [release]: an official version from any branch)
    # every build is an official version (the web lists them by themselves);
    # the desktop app too if it was built (if it failed, the release goes without it)
    if: always() && needs.apk.result == 'success' && needs.exe.result == 'success'
    needs: [apk, exe, desktop, mac]
    runs-on: ubuntu-latest
    steps:
      # the official version: the same number the apps show (2.0.99 → 2.1.0 …)
      - id: v
        run: |
          K=$(( ${{ github.run_number }} - 260 )); K=$(( K < 0 ? 0 : K ))
          echo "tag=v2.$(( K / 100 )).$(( K % 100 ))" >> "$GITHUB_OUTPUT"

      # the old v2.0.0 (from before MixUp) goes away, so MixUp's 2.0.0 gets
      # its tag on this commit
      - name: Drop the old v2.0.0
        if: steps.v.outputs.tag == 'v2.0.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v2.0.0 --cleanup-tag --yes -R "${{ github.repository }}" || true

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MixUp ${{ steps.v.outputs.tag }}
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            out/MixUp.apk
            out/MixUp.exe
            out/MixUp-Instalador.exe
            out/MixUp-Portable.exe
            out/MixUp-macOS.dmg
            out/MixUp-macOS.zip
          body: |
            ## MixUp ${{ steps.v.outputs.tag }}

            Reproductor de música local con estética de fanzine, para Windows, Android y Mac.

            **Windows** — `MixUp-Instalador.exe` (se instala como una app más y se actualiza sola) o `MixUp-Portable.exe` (sin instalar: en un USB, la música y los ajustes van en el propio USB). Si tenías el `ZenTor.exe` o el `MixUp.exe` de un solo archivo, se pasa solo a esta app sin perder nada.
            - En un USB funciona en modo portátil: la música y los ajustes van en el propio USB.
            - En una carpeta del PC funciona instalado: lee tu carpeta Música y guarda los ajustes en tu perfil.
            - Se actualiza solo.

            **Mac** — `MixUp-macOS.dmg` (macOS 11 o posterior, Apple Silicon e Intel): ábrelo y arrastra MixUp a Aplicaciones. Se actualiza sola. La primera vez: clic derecho → *Abrir* (en macOS 15: *Ajustes del Sistema → Privacidad y seguridad → Abrir igualmente*).

            **Android** — descarga `MixUp.apk` e instálala (Android te pedirá permitir apps de esta fuente). Lee la música del móvil y avisa cuando hay una versión nueva.

            ### ¿Es seguro? Sí

            Windows y Android pueden avisar de que MixUp es «peligroso», «no seguro» o «malware». **No es por lo que hace, es porque no está firmado** con un certificado de pago ni viene de una tienda oficial.

            - **Windows** («Windows protegió su PC»): *Más información → Ejecutar de todas formas*.
            - **Android** («App no segura» / «App bloqueada» de Play Protect): *Más detalles → Instalar de todas formas*.

            Todo el código es abierto y estos archivos los compila GitHub Actions a partir de él. MixUp solo usa tu música y su carpeta de datos, y solo se conecta a internet para lo que usas (YouTube, Spotify, Deezer, iTunes, Wikipedia y GitHub para actualizarse). Sin cuentas, sin anuncios y sin enviar tus datos.

            **¿Quieres comprobarlo tú?** Sube `MixUp.exe` o `MixUp.apk` a [VirusTotal](https://www.virustotal.com) (lo analizan más de 70 antivirus), o pásale el código o el enlace del repositorio a una IA como Claude para que te explique qué hace. Más detalles en el [README](https://github.com/luckicla/zentor#es-seguro-por-qué-windows-y-android-avisan).
