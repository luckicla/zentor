name: ZenTor (APK + exe)

on:
  push:
    branches: [android, main, 'release/**']
    paths: ['android/**', 'web/**', '**.go', 'go.mod', 'res.rc', 'build.sh', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ZenTor.apk
          # the app compares this with its own versionCode to find updates
          echo "${{ github.run_number }} $(sha256sum ZenTor.apk | cut -d' ' -f1)" > version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ZenTor-apk
          path: ZenTor.apk

      # A fixed "android-latest" release, so the newest APK is always at the same link.
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ZenTor para Android
          prerelease: true
          make_latest: false
          body: Última versión compilada de la rama ${{ github.ref_name }}. Descarga ZenTor.apk e instálala en el móvil.
          files: |
            ZenTor.apk
            version.txt

  exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Tools for the icon resource
        run: |
          # the runner usually has LLVM already; install only if llvm-rc is missing (with retries)
          if ! ls /usr/lib/llvm-*/bin/llvm-rc >/dev/null 2>&1 && ! command -v llvm-rc >/dev/null; then
            for i in 1 2 3; do
              sudo apt-get update -qq || true
              sudo apt-get install -y -qq --fix-missing llvm && break
              sleep 20
            done
          fi
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -1 >> "$GITHUB_PATH"

      - name: Build
        run: |
          # 1.5.<n> for people, one more with every change (build 106 was 1.5.14);
          # the build number goes last (hidden), it's what updates compare
          V="1.5.$(( ${{ github.run_number }} - 92 ))"
          VERSION="$V.${{ github.run_number }}" ./build.sh
          test -f rsrc_windows_amd64.syso  # the icon made it in
          echo "$V.${{ github.run_number }} $(sha256sum ZenTor.exe | cut -d' ' -f1)" > version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ZenTor-exe
          path: ZenTor.exe

      # ZenTor.exe checks this release for updates
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-latest
          name: ZenTor para PC
          prerelease: true
          make_latest: false
          body: Última versión de ZenTor.exe. Se actualiza sola; si la quieres a mano, pon ZenTor.exe en la raíz del USB.
          files: |
            ZenTor.exe
            version.txt

  # A push to a release/... branch: also a proper release (tag v1.5.<n>, the
  # same number the apps show) with both, the APK and the exe
  release:
    if: startsWith(github.ref, 'refs/heads/release/')
    needs: [apk, exe]
    runs-on: ubuntu-latest
    steps:
      # the official version: the same number the apps show (1.5.<n>)
      - id: v
        run: echo "tag=v1.5.$(( ${{ github.run_number }} - 92 ))" >> "$GITHUB_OUTPUT"

      # the 2 is for something bigger: the old v2.0.0 goes away
      - name: Drop v2.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v2.0.0 --cleanup-tag --yes -R "${{ github.repository }}" || true

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ZenTor ${{ steps.v.outputs.tag }}
          make_latest: true
          files: |
            out/ZenTor.apk
            out/ZenTor.exe
          body: |
            ## ZenTor ${{ steps.v.outputs.tag }}

            Reproductor de música local con estética de fanzine, para Windows y Android.

            **Windows** — descarga `ZenTor.exe`.
            - En un USB funciona en modo portátil: la música y los ajustes van en el propio USB.
            - En una carpeta del PC funciona instalado: lee tu carpeta Música y guarda los ajustes en tu perfil.
            - Se actualiza solo.

            **Android** — descarga `ZenTor.apk` e instálala (Android te pedirá permitir apps de esta fuente). Lee la música del móvil y avisa cuando hay una versión nueva.
