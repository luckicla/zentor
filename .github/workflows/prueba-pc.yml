# Prueba de MixUp en un Windows de verdad: se compila una versión «vieja»
# (2.0.0) de la app de escritorio y se comprueba, cada cosa en un Windows
# limpio:
#   - instalada: abre, suena una canción, y al pulsar «Actualizar» se baja la
#     publicada en pc-latest, se instala sola y se abre la nueva
#   - portable: lo mismo, y el .exe del USB queda cambiado por el nuevo
#   - el MixUp.exe/ZenTor.exe suelto de antes: se pasa solo a la app instalada
# Se lanza a mano desde Actions.
name: Prueba en PC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compilar (versión 2.0.0, para que haya una nueva que bajar)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          mkdir -p desktop/bin out
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=2.0.0.200" -o desktop/bin/mixup-core.exe .
          # el exe suelto de antes, con un número alto: no se cambia por el
          # publicado y así se prueba este paso a la app de escritorio
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=2.0.0.99999" -o out/MixUp.exe .
          cd desktop
          npm install --no-audit --no-fund
          npm version 2.0.0 --no-git-tag-version --allow-same-version
          npx electron-builder --win nsis portable --publish never
          cp dist/MixUp-Instalador.exe dist/MixUp-Portable.exe ../out/
      - uses: actions/upload-artifact@v4
        with:
          name: viejos
          path: out/

  prueba:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        caso: [instalada, portable, suelto]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: viejos
          path: viejos
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Herramientas y canciones de prueba
        shell: bash
        run: |
          pip install -q playwright
          # canciones con portada (la portada era justo lo que hacía que no sonaran)
          mkdir -p "$USERPROFILE/Music" C:/usb
          cp tools/pctest/canciones/*.mp3 "$USERPROFILE/Music/"
          cp tools/pctest/canciones/*.mp3 C:/usb/
          V=$(curl -sL https://github.com/luckicla/zentor/releases/download/pc-latest/version.txt | cut -d' ' -f1)
          echo "PUBLICADA=$V" >> "$GITHUB_ENV"
          echo "publicada: $V"

      - name: Instalada — instalar, sonar y actualizarse
        if: matrix.caso == 'instalada'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # (el instalador de NSIS a veces se cae al empezar en estas máquinas: hasta 3 veces)
          $app = $null
          for ($t = 1; $t -le 3 -and -not $app; $t++) {
            $p = Start-Process viejos\MixUp-Instalador.exe -ArgumentList '/S' -Wait -PassThru
            "instalador (intento $t): $($p.ExitCode)"
            $app = @("$env:LOCALAPPDATA\Programs\MixUp\MixUp.exe", "$env:LOCALAPPDATA\Programs\mixup\MixUp.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $app) { Write-Error 'no se instaló'; exit 1 }
          "instalada en $app"
          Start-Process $app -ArgumentList '--remote-debugging-port=9222'
          python tools/pctest/run.py play 9222
          if ($LASTEXITCODE) { exit 1 }
          python tools/pctest/run.py update 9222 $env:PUBLICADA
          if ($LASTEXITCODE) { exit 1 }
          $v = (Get-Item $app).VersionInfo.ProductVersion
          "MixUp.exe instalado ahora: $v"
          if (-not $env:PUBLICADA.StartsWith($v)) { Write-Error "el exe instalado sigue siendo $v"; exit 1 }

      - name: Portable — sonar y actualizarse
        if: matrix.caso == 'portable'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Copy-Item viejos\MixUp-Portable.exe C:\usb\MixUp-Portable.exe
          Start-Process C:\usb\MixUp-Portable.exe -ArgumentList '--remote-debugging-port=9222' -WorkingDirectory C:\usb
          python tools/pctest/run.py play 9222
          if ($LASTEXITCODE) { exit 1 }
          python tools/pctest/run.py update 9222 $env:PUBLICADA
          if ($LASTEXITCODE) { exit 1 }
          $v = (Get-Item C:\usb\MixUp-Portable.exe).VersionInfo.ProductVersion
          "MixUp-Portable.exe ahora: $v"
          Get-ChildItem C:\usb | Format-Table Name, Length
          if (-not $env:PUBLICADA.StartsWith($v)) { Write-Error "la portable sigue siendo $v"; exit 1 }

      - name: Suelto — el MixUp.exe de antes se pasa solo a la app instalada
        if: matrix.caso == 'suelto'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $desk = [Environment]::GetFolderPath('Desktop')
          Copy-Item viejos\MixUp.exe "$desk\MixUp.exe"
          Start-Process "$desk\MixUp.exe" -ArgumentList '-headless'
          Start-Sleep 5
          "sirve: " + (curl.exe -s http://127.0.0.1:47811/api/version)
          # (a los 20 s busca la app nueva; «Instalar ahora» de Ajustes no espera)
          Start-Sleep 22
          curl.exe -s -X POST "http://127.0.0.1:47811/api/update?do=migrate"
          $app = $null
          for ($i = 0; $i -lt 150 -and -not $app; $i++) {
            Start-Sleep 4
            $s = curl.exe -s http://127.0.0.1:47811/api/update
            if ($i % 5 -eq 0) { "estado: $s" }
            $app = @("$env:LOCALAPPDATA\Programs\MixUp\MixUp.exe", "$env:LOCALAPPDATA\Programs\mixup\MixUp.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $app) { Write-Error 'no se instaló la app'; exit 1 }
          "instalada en $app"
          $v = ''
          for ($i = 0; $i -lt 60 -and $v -ne $env:PUBLICADA; $i++) { Start-Sleep 3; $v = curl.exe -s http://127.0.0.1:47811/api/version }
          "sirve ahora: $v"
          if ($v -ne $env:PUBLICADA) { Write-Error 'la app nueva no se abrió'; exit 1 }
          Start-Sleep 5
          if (Test-Path "$desk\MixUp.exe") { Write-Error 'el exe suelto sigue ahí'; exit 1 }
          if (-not (Test-Path "$desk\MixUp.lnk")) { Write-Error 'falta el icono del escritorio'; exit 1 }
          'OK: pasado a la app instalada, con su icono en el escritorio'

      - name: Registros
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          if (Test-Path C:\usb) { Get-ChildItem C:\usb | Format-Table Name, Length, LastWriteTime }
          foreach ($d in @("$env:APPDATA\MixUp", "$env:APPDATA\mixup", "$env:APPDATA\ZenTor", "C:\usb\.zentor")) {
            if (Test-Path $d) { Get-ChildItem $d -Recurse -Include *.log, *.txt -ErrorAction SilentlyContinue | ForEach-Object { "==== $($_.FullName)"; Get-Content $_ -Tail 80 } }
          }
          Get-Process | Where-Object { $_.Name -match 'mixup|powershell' } | Format-Table Name, Id, Path
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-${{ matrix.caso }}
          path: out/
